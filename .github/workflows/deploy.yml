name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Oder "master", je nachdem wie dein Haupt-Branch heißt

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Node 22 liefert npm 10.9 mit, die package-lock.json wird lokal aber mit
      # npm 11 erzeugt. npm 10 erwartet dort Eintraege (@emnapi/core, @emnapi/runtime),
      # die npm 11 als optionale Peer-Deps weglaesst -> "npm ci" bricht ab.
      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        env:
          VITE_BASE: './' # GitHub Pages liefert aus einem Unterpfad aus
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite gibt den Build im 'dist'-Ordner aus
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
